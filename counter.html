<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <h1 style="color: black;text-align: center;padding-top: 10px;">Counter App</h1>
    <h1 id="count" style="text-align:center">0</h1>
    <style>button:hover{cursor: pointer;opacity:0.8;}</style>
</head>
<body style="background-color: azure;">
    <div style="display: flex;justify-content: center;gap: 20px;margin-top: 10px;">
    <button onclick="increment()" style="background-color:green;color:white;border-radius: 5px;text-align: center;font-size: 20px; ;">Increment</button>
    <button onclick="reset()" style="background-color:orange;color:white;border-radius: 5px;text-align: center;font-size: 20px;">Reset</button>
    <button onclick="decrement()" style="background-color:red;color:white;border-radius: 5px;text-align: center;font-size: 20px;padding: 10px;">Decrement</button>
    </div>
    </body>
<script>
    let count=0
    function change(){
        document.getElementById("count").textContent=count;
    }
    function increment(){
        count++;
        change();
    }
    function decrement(){
        count--;
        change();
    }
    function reset(){
        count=0;
        change();
    }

</script>
</html>
